<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>knowSelf</title>
    <script>
      // 首屏主题防闪：挂载前按存储/系统偏好决定 <html class="dark">。
      // 行为与迁移前一致（localStorage 键 knowself-theme，支持 light/dark/system）。
      (function () {
        try {
          var saved = localStorage.getItem("knowself-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = saved === "dark" || ((saved === "system" || !saved) && prefersDark);
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
